<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <style>
    body {
      background-color: lightgrey;
    }
    h1 {
      text-align: center;
      color: darkblue;
    }
    label {
      font-size: 18px;
      display: inline-block;
      width: 115px;
    }
    input {
      height: 25px;
    }
    button {
      background-color: lightseagreen;
      color: white;
      padding: 8px 15px;
    }
  </style>

  <body>
    <div class="form-container">
      <h1>Student Registration Form</h1>
      <form>
        <!-- Roll Number -->
        <div class="row">
          <label class="label">Roll no:</label>
          <input type="text" id="rollNo" />
        </div>
        <br />
        <!-- Student Name -->
        <div class="row">
          <label class="label">Student name:</label>
          <input
            type="text"
            id="firstName"
            placeholder="First Name"
            class="small-input"
          />

          <input
            type="text"
            id="lastName"
            placeholder="Last Name"
            class="small-input"
          />
        </div>
        <br />
        <!-- Father's Name -->
        <div class="row">
          <label class="label">Father's Name: </label>
          <input type="text" id="fatherName" />
        </div>
        <br />
        <!-- Date of Birth -->
        <div class="row">
          <label class="label">Date of Birth:</label>
          <input type="text" placeholder="Day" class="date-input" />
          <!-- <span>&nbsp;-&nbsp;</span> -->
          <input type="text" placeholder="month" class="date-input" />
          <!-- <span>&nbsp;-&nbsp;</span> -->
          <input type="text" placeholder="year" class="year-input" />
          <span>&nbsp;(DD-MM_YYYY)</span>
        </div>
        <br />
        <!-- Mobile Number -->
        <div class="row">
          <label class="label">Mobile no:</label>
          <input type="text" value="+91" class="data-input" />
          <span>&nbsp; - &nbsp;</span>
          <input type="text" id="mobile" class="mobile-input" />
        </div>
        <br />
        <!-- Email -->
        <div class="row">
          <label class="label">Email id:</label>
          <input type="email" id="email" />
        </div>
        <br />
        <!-- Password -->
        <div class="row">
          <label class="label">password:</label>
          <input type="password" id="password" />
        </div>
        <br />
        <!-- Gender -->
        <div class="row">
          <label class="label">Gender:</label>
          <input type="radio" name="gender" value="Male" />
          <label>Male</label>
          <input type="radio" name="gender" value="Female" />
          <label>Female</label>
        </div>
        <br />
        <!-- Department -->
        <div class="row">
          <label class="label">Department:</label>
          <input type="radio" name="department" value="CSE" />CSE
          <input type="radio" name="department" value="IT" />IT
          <input type="radio" name="department" value="ECE" />ECE
          <input type="radio" name="department" value="Civil" />Civil
          <input type="radio" name="department" value="Mech" />Mech
        </div>
        <br />
        <!-- Course -->
        <div class="row">
          <label class="label">Course:</label>
          <select id="course">
            <option>--------Select Current Course's--------</option>
            <option value="B.tect">B.tect</option>
            <option value="M.tect">M.tect</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
          </select>
        </div>
        <br />
        <!-- Student Photo -->
        <div class="row">
          <label class="label">student photo: </label>
          <input type="file" class="photo" />
        </div>
        <br />
        <!-- City -->
        <div class="row">
          <label class="label">city:</label>
          <input type="text" id="city" />
        </div>
        <br />
        <!-- Address -->
        <div class="row">
          <label class="label">Address:</label>
          <textarea></textarea>
        </div>
        <br />
        <!-- Register Button -->
        <div class="register">
          <button type="button" id="registerBtn">Register</button>
        </div>
      </form>
    </div>
    <script>
      let button = document.getElementById("registerBtn");
      button.addEventListener("click", function () {
        let rollNo = document.getElementById("rollNo").value;
        let firstName = document.getElementById("firstName").value;
        if (firstName === "") {
          alert("Please enter your first name");
          return;
        }
        let lastName = document.getElementById("lastName").value;
        if (lastName === "") {
          alert("Please enter your last name");
          return;
        }
        let fatherName = document.getElementById("fatherName").value;
        let email = document.getElementById("email").value;
        if (email === "") {
          alert("Please enter your email");
          return;
        }
        let mobile = document.getElementById("mobile").value;
        if (mobile === "") {
          alert("Please enter your mobile number");
          return;
        }
        if (mobile.length !== 10) {
          alert("Mobile number must be 10 digits");
          return;
        }
        if (isNaN(mobile)) {
          alert("Please enter only numbers");
          return;
        }
        let password = document.getElementById("password").value;
        if (password === "") {
          alert("Please enter your password");
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters");
          return;
        }
        let city = document.getElementById("city").value;
        let gender = document.querySelector('input[name="gender"]:checked');
        if (!gender) {
          alert("Please select your gender");
          return;
        }
        let department = document.querySelector(
          'input[name="department"]:checked',
        );
        if (!department) {
          alert("Please select your department");
          return;
        }
        let course = document.getElementById("course").value;
        if (course === "") {
          alert("Please select your course");
          return;
        }
        console.log("Roll No:", rollNo);
        console.log("First Name:", firstName);
        console.log("Last Name:", lastName);
        console.log("Father Name:", fatherName);
        console.log("Email:", email);
        console.log("City:", city);
        console.log("Gender:", gender ? gender.value : "Not Selected");
        console.log( "Department:", department ? department.value : "Not Selected", );
        console.log("Course:", course);
        alert("Registration Successful!");
      });
    </script>
  </body>
</html>
